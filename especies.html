<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especies | PesquerosUY</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/especies.css">
    <link rel="stylesheet" href="css/estado-datos.css">
</head>

<body>
    <!-- NAVBAR -->
    <header>
        <div id="navbar-container"></div>
    </header>

    <div id="container">
        <a href="index.html" class="volver-lista">
            ← Volver al inicio
        </a>
        <h1>Especies de Uruguay</h1>
        <p>Seleccioná una especie para explorar sus características o buscala aquí.</p>

        <div class="search-controls">
            <div class="search-field">
                <svg class="search-field__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Buscar por nombre común o científico..."
                    aria-label="Buscar especies por nombre común o científico"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
            <button type="button" id="btn-limpiar" hidden>Limpiar</button>
        </div>

        <div id="estado-datos" role="status" aria-live="polite" hidden></div>
        <div id="contenedor-especies" class="contenedor-especies"></div>
    </div>
    <script src="js/navbar.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/especies.js"></script>
</body>

</html>
