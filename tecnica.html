<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnica | PesquerosUY</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/tecnica.css">
</head>

<body>
    <!-- NAVBAR -->
    <header>
        <div id="navbar-container"></div>
    </header>

    <main class="detalle-tecnica">

        <a href="tecnicas.html" class="volver-lista">
            ← Volver a lista
        </a>

        <!-- INFORMACIÓN PRINCIPAL -->
        <section class="tecnica-hero">

            <div class="tecnica-imagen">
                <img id="imagen-tecnica" src="" alt="">
            </div>

            <div class="tecnica-info">
                <h1 id="nombre-tecnica"></h1>
                <p id="descripcion-tecnica"></p>
            </div>

        </section>


        <!-- EQUIPO -->
        <section class="seccion-equipo">

            <h2>Equipo recomendado</h2>

            <div id="equipo-recomendado" class="equipo-grid"></div>

        </section>


        <!-- GALERÍA -->
        <section id="seccion-galeria" class="seccion-galeria" hidden>

            <h2>Galería</h2>

            <div id="galeria-tecnica" class="galeria-grid"></div>

        </section>

    </main>


    <script src="js/navbar.js"></script>
    <script src="js/tecnica.js"></script>
</body>

</html>
